# ================================================================
#  Student Placement Management System - common configuration
#
#  The database part is kept in two profile files:
#     application-h2.properties     -> H2 in memory  (default, nothing to install)
#     application-mysql.properties  -> MySQL server  (permanent storage)
#
#  Switch the database in one of these two ways:
#     1. change the line below to  spring.profiles.active=mysql
#     2. or pass it while starting:  java -jar app.jar --spring.profiles.active=mysql
# ================================================================
spring.application.name=student-placement-system
spring.profiles.active=h2
# Hosting platforms such as Render hand the port over in $PORT
server.port=${PORT:8080}

# ---------------- Health check ----------------------------------
# Only the health endpoint is exposed: GET /actuator/health -> {"status":"UP"}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------------- JPA / Hibernate (same for both databases) -----
# The generated SQL is printed on the console, which is useful while
# explaining how JPA turns a method call into a query.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# The Thymeleaf pages read a student's application list while rendering,
# so the session is deliberately kept open for the whole request.
spring.jpa.open-in-view=true

# ---------------- Web layer -------------------------------------
# templates are re-read on every request, so a page edit needs no restart
spring.thymeleaf.cache=false
# <input type="date"> posts yyyy-MM-dd, this maps it on to LocalDate
spring.mvc.format.date=iso
