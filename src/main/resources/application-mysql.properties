# ================================================================
#  Profile: mysql
#
#  Same application code, permanent storage. Run this once in MySQL
#  before starting the app with this profile:
#
#     CREATE DATABASE placement_db;
#     CREATE USER 'placement'@'localhost' IDENTIFIED BY '<your-password>';
#     GRANT ALL PRIVILEGES ON placement_db.* TO 'placement'@'localhost';
#
#  Start with:  DB_PASSWORD=<your-password> java -jar target/placement-portal.jar --spring.profiles.active=mysql
#  (DB_URL and DB_USERNAME can be overridden the same way - see .env.example)
# ================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/placement_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Kolkata}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:placement}
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates or alters the tables to match the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# The seed file is written with INSERT IGNORE, so a restart does not
# duplicate the sample rows and the data added from the portal stays.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-mysql.sql
