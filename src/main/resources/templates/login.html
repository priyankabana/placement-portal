<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<div class="login-page">
    <div class="login-card">
        <h1>Sign in</h1>
        <p class="muted small">Use the tab that matches your account</p>

        <!-- two tabs, each one only reloads the page with a different type -->
        <div class="login-tabs">
            <a th:href="@{/login(tab='staff')}"
               th:classappend="${loginType != 'student'} ? 'on'">Faculty / Officer</a>
            <a th:href="@{/login(tab='student')}"
               th:classappend="${loginType == 'student'} ? 'on'">Student</a>
        </div>

        <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <div class="alert alert-success" th:if="${param.signedOut}">You have been signed out.</div>

        <form method="post" th:action="@{/login}">
            <!-- tells the controller which table to check -->
            <input type="hidden" name="loginType" th:value="${loginType} ?: 'staff'">

            <div class="field">
                <label for="username"
                       th:text="${loginType == 'student'} ? 'Roll number' : 'Staff user id'">User id</label>
                <input type="text" id="username" name="username" th:value="${username}"
                       th:placeholder="${loginType == 'student'} ? 'CS22001' : 'placement.officer'"
                       autocomplete="username" required autofocus>
            </div>

            <div class="field" style="margin-top:14px">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       autocomplete="current-password" required>
            </div>

            <button class="btn login-btn" type="submit">Sign in</button>
        </form>
    </div>
</div>
</body>
</html>
