<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Students')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <div class="main">
        <div class="topbar">
            <div>
                <h1>Students</h1>
                <p th:text="${#lists.size(students)} + ' student(s) in the list'">0 students</p>
            </div>
            <div class="topbar-actions" th:if="${session.user.staff}">
                <a class="btn" th:href="@{/students/new}">Register student</a>
            </div>
        </div>

        <div class="content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card">
                <!-- GET form, so the search stays in the address bar and can be shared -->
                <form class="filter-bar" method="get" th:action="@{/students}">
                    <div class="field">
                        <label for="keyword">Name or roll number</label>
                        <input type="text" id="keyword" name="keyword" th:value="${keyword}"
                               placeholder="e.g. Aditi or CS22001">
                    </div>
                    <div class="field">
                        <label for="departmentId">Branch</label>
                        <select id="departmentId" name="departmentId" data-auto-submit>
                            <option value="">All branches</option>
                            <option th:each="dept : ${departments}"
                                    th:value="${dept.id}"
                                    th:text="${dept.name}"
                                    th:selected="${departmentId != null and departmentId == dept.id}">branch</option>
                        </select>
                    </div>
                    <div class="field">
                        <button class="btn" type="submit">Search</button>
                    </div>
                    <div class="field">
                        <a class="btn btn-ghost" th:href="@{/students}">Clear</a>
                    </div>
                </form>

                <div class="table-wrap">
                    <table class="data">
                        <thead>
                        <tr>
                            <th>Roll number</th>
                            <th>Name</th>
                            <th>Branch</th>
                            <th class="num">CGPA</th>
                            <th class="num">Backlogs</th>
                            <th>Placement</th>
                            <th class="actions-cell" th:if="${session.user.staff}">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="student : ${students}">
                            <td class="mono" th:text="${student.rollNumber}">roll</td>
                            <td>
                                <a class="row-title" th:href="@{'/students/' + ${student.id}}"
                                   th:text="${student.fullName}">name</a>
                                <div class="row-sub" th:text="${student.email}">email</div>
                            </td>
                            <td>
                                <span class="pill pill-plain" th:text="${student.department.code}">CSE</span>
                            </td>
                            <td class="num" th:text="${student.cgpa}">0</td>
                            <td class="num" th:text="${student.backlogs}">0</td>
                            <td>
                                <span class="pill pill-selected" th:if="${student.placed}">Placed</span>
                                <span class="pill pill-plain" th:unless="${student.placed}">Not placed</span>
                            </td>
                            <td class="actions-cell" th:if="${session.user.staff}">
                                <a class="btn btn-ghost btn-sm" th:href="@{'/students/' + ${student.id}}">View</a>
                                <a class="btn btn-ghost btn-sm" th:href="@{'/students/' + ${student.id} + '/edit'}">Edit</a>
                                <form class="inline-form" method="post"
                                      th:action="@{'/students/' + ${student.id} + '/delete'}"
                                      th:data-confirm="'Remove ' + ${student.fullName} + ' and the application history?'">
                                    <button class="btn btn-danger btn-sm" type="submit">Delete</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(students)}">
                            <td colspan="7" class="empty">
                                No student matched this search. Try clearing the filters.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
</body>
</html>
