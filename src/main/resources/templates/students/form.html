<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Student form')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <div class="main">
        <div class="topbar">
            <div>
                <h1 th:text="${formTitle}">Student form</h1>
                <p>Fields marked with * are compulsory</p>
            </div>
            <div class="topbar-actions">
                <a class="btn btn-ghost" th:href="@{/students}">Back to list</a>
            </div>
        </div>

        <div class="content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card">
                <div class="card-body">
                    <!-- th:object binds every input below to the Student model attribute -->
                    <form method="post" th:action="@{/students/save}" th:object="${student}">

                        <!-- an id means the service should update instead of insert -->
                        <input type="hidden" th:field="*{id}">

                        <div class="form-grid">
                            <div class="field">
                                <label for="rollNumber">Roll number *</label>
                                <input type="text" id="rollNumber" th:field="*{rollNumber}"
                                       th:classappend="${#fields.hasErrors('rollNumber')} ? 'invalid'"
                                       placeholder="CS22001">
                                <span class="field-error" th:if="${#fields.hasErrors('rollNumber')}"
                                      th:errors="*{rollNumber}">error</span>
                                <span class="note">Same roll number cannot be registered twice</span>
                            </div>

                            <div class="field">
                                <label for="department">Branch *</label>
                                <!-- the dropdown posts the department id, a Converter turns it
                                     back into a Department object before validation runs -->
                                <select id="department" name="department"
                                        th:classappend="${#fields.hasErrors('department')} ? 'invalid'">
                                    <option value="">Select branch</option>
                                    <option th:each="dept : ${departments}"
                                            th:value="${dept.id}"
                                            th:text="${dept.name} + ' (' + ${dept.code} + ')'"
                                            th:selected="${student.department != null and student.department.id == dept.id}">
                                        branch
                                    </option>
                                </select>
                                <span class="field-error" th:if="${#fields.hasErrors('department')}"
                                      th:errors="*{department}">error</span>
                            </div>

                            <div class="field">
                                <label for="firstName">First name *</label>
                                <input type="text" id="firstName" th:field="*{firstName}"
                                       th:classappend="${#fields.hasErrors('firstName')} ? 'invalid'">
                                <span class="field-error" th:if="${#fields.hasErrors('firstName')}"
                                      th:errors="*{firstName}">error</span>
                            </div>

                            <div class="field">
                                <label for="lastName">Last name *</label>
                                <input type="text" id="lastName" th:field="*{lastName}"
                                       th:classappend="${#fields.hasErrors('lastName')} ? 'invalid'">
                                <span class="field-error" th:if="${#fields.hasErrors('lastName')}"
                                      th:errors="*{lastName}">error</span>
                            </div>

                            <div class="field">
                                <label for="email">College email *</label>
                                <input type="email" id="email" th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email')} ? 'invalid'"
                                       placeholder="name@campus.edu.in">
                                <span class="field-error" th:if="${#fields.hasErrors('email')}"
                                      th:errors="*{email}">error</span>
                            </div>

                            <div class="field">
                                <label for="phone">Mobile number</label>
                                <input type="text" id="phone" th:field="*{phone}"
                                       th:classappend="${#fields.hasErrors('phone')} ? 'invalid'"
                                       placeholder="10 digits">
                                <span class="field-error" th:if="${#fields.hasErrors('phone')}"
                                      th:errors="*{phone}">error</span>
                            </div>

                            <div class="field">
                                <label for="cgpa">CGPA *</label>
                                <input type="number" step="0.01" min="0" max="10" id="cgpa" th:field="*{cgpa}"
                                       th:classappend="${#fields.hasErrors('cgpa')} ? 'invalid'">
                                <span class="field-error" th:if="${#fields.hasErrors('cgpa')}"
                                      th:errors="*{cgpa}">error</span>
                                <span class="note">Out of 10, up to two decimals</span>
                            </div>

                            <div class="field">
                                <label for="batchYear">Passing out year *</label>
                                <input type="number" id="batchYear" th:field="*{batchYear}"
                                       th:classappend="${#fields.hasErrors('batchYear')} ? 'invalid'"
                                       placeholder="2026">
                                <span class="field-error" th:if="${#fields.hasErrors('batchYear')}"
                                      th:errors="*{batchYear}">error</span>
                            </div>

                            <div class="field">
                                <label for="backlogs">Live backlogs *</label>
                                <input type="number" min="0" id="backlogs" th:field="*{backlogs}"
                                       th:classappend="${#fields.hasErrors('backlogs')} ? 'invalid'">
                                <span class="field-error" th:if="${#fields.hasErrors('backlogs')}"
                                      th:errors="*{backlogs}">error</span>
                                <span class="note">Drives use this number for eligibility</span>
                            </div>

                            <div class="field">
                                <label for="resumeUrl">Resume link</label>
                                <input type="text" id="resumeUrl" th:field="*{resumeUrl}"
                                       th:classappend="${#fields.hasErrors('resumeUrl')} ? 'invalid'"
                                       placeholder="drive.campus.edu.in/cs22001">
                                <span class="field-error" th:if="${#fields.hasErrors('resumeUrl')}"
                                      th:errors="*{resumeUrl}">error</span>
                            </div>
                        </div>

                        <div class="form-actions">
                            <button class="btn" type="submit">Save student</button>
                            <a class="btn btn-ghost" th:href="@{/students}">Cancel</a>
                            <span class="small muted">Validation runs on the server before anything is stored</span>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
</body>
</html>
