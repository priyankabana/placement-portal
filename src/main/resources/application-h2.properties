# ================================================================
#  Profile: h2   (default)
#
#  H2 keeps the whole database in RAM, so the project runs on any
#  machine without installing a database server first. Every restart
#  gives a fresh copy of the sample data written in data.sql.
# ================================================================
spring.datasource.url=jdbc:h2:mem:placementdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Browse the live tables at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:placementdb, user: sa, no password)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Hibernate creates the tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update

# data.sql has to wait until Hibernate has created the tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
