# ================================================================
#  Profile: prod   (added on top of h2 or mysql on a deployed server)
#
#     SPRING_PROFILES_ACTIVE=h2,prod      demo with the in memory data
#     SPRING_PROFILES_ACTIVE=mysql,prod   permanent storage
# ================================================================

# The H2 console gives full SQL access, so it is never exposed on a server
spring.h2.console.enabled=false

# Quieter logs and cached templates
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.thymeleaf.cache=true

# Error pages never print stack traces
server.error.include-stacktrace=never
server.error.include-message=never

# Session cookie cannot be read from JavaScript
server.servlet.session.cookie.http-only=true

# Render (and most hosts) end TLS at a proxy; trust its X-Forwarded headers
server.forward-headers-strategy=framework
